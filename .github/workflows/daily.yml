name: Mercedes E50 AMG Daily Search
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r e50_amg_bot/requirements.txt
      - name: Direct portal scan
        working-directory: e50_amg_bot
        run: python bot.py
      - name: Update dashboard
        working-directory: e50_amg_bot
        run: python dashboard.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e50_amg_bot/listings.sqlite3 e50_amg_bot/candidates.csv e50_amg_bot/country_summary.csv e50_amg_bot/dashboard.html
          if ! git diff --cached --quiet; then
            git commit -m 'Daily E50 AMG direct portal snapshot'
            git push
          fi
